name: Build Android .so Library

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Compile Library
        run: |
          export NDK_HOME=$PWD/android-ndk-r26b
          mkdir -p build && cd build
          $NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ -shared -fPIC ../*.cpp -o hak.bloodstraik.so || {
            echo "Direct compilation failed, trying alternative path..."
            $NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ -shared -fPIC ../app/src/main/cpp/*.cpp -o hak.bloodstraik.so
          }
          mv hak.bloodstraik.so ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-so-library
          path: hak.bloodstraik.so

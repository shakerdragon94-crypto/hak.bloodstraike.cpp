name: Build Android .so Library

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          echo "Downloading NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Compile Library
        run: |
          export NDK_HOME=$PWD/android-ndk-r26b
          if [ -f "jni/Android.mk" ]; then
            $NDK_HOME/ndk-build
          elif [ -f "CMakeLists.txt" ]; then
            mkdir build && cd build
            cmake -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
            make
          else
            echo "Searching for source files to compile..."
            mkdir -p build && cd build
            $NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ -shared -fPIC ../*.cpp -o libbloodstrike.so || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-so-library
          path: |
            *.so
            libs/**/*.so
            obj/**/*.so
            build/**/*.so

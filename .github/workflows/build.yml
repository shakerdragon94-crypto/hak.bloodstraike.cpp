name: Updatebuild.yml

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Clean and Compile Library
        run: |
          export NDK_HOME=$PWD/android-ndk-r26b
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          find . -name "*.cpp" -o -name "*.h" -exec sed -i 's/\xE2\x80\x8B//g' {} +
          
          SRC_FILES=$(find . -maxdepth 3 -name "*.cpp" -o -name "*.cc")
          echo "Compiling files: $SRC_FILES"
          
          $TOOLCHAIN/aarch64-linux-android24-clang++ -shared -fPIC $SRC_FILES -o hak.bloodstraik.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-so-library
          path: hak.bloodstraik.so

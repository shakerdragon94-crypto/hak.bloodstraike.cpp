name: Build Android .so Library

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Setup Android NDK r26b via Python
        run: |
          python3 -c '
          import urllib.request, zipfile, os
          url = "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip"
          print("Downloading NDK...")
          urllib.request.urlretrieve(url, "ndk.zip")
          print("Extracting NDK...")
          with zipfile.ZipFile("ndk.zip", "r") as zip_ref:
              zip_ref.extractall(".")
          os.rename("android-ndk-r26b", "my_ndk")
          '
          echo "ANDROID_NDK_HOME=$PWD/my_ndk" >> $GITHUB_ENV

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 ..
          make

      - name: Upload Built .so File
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-so-library
          path: build/libbloodstrike_mod.so
